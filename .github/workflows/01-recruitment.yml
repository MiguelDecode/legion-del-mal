name: Recruitment of new aggent

on: push 

jobs: 
  report-recruitment:
    runs-on: ubuntu-latest

    steps: 
      - name: The agent introduce himself
        run: echo "Hello I'm the new agent, Lex Luthor."

      - name: Report of identity
        run: |
          echo "Report of the indentity of the agent"
          echo "============="
          echo "Key name: ${{github.actor}}"
          echo "============="
          echo "Github Context"
          echo "Repository: ${{github.repository}}"
          echo "============="
          echo "Operation: ${{github.sha}}"
          echo "Metadata: ${{toJson(github)}}"

      - name: Agent halibities
        run: |
          echo "Agent halibities checked:"
          echo "Operative System"
          uname -a
          echo "Tecnical habilities"
          node --version
          git --version
          python3 --version

      - name: Investigate the surrounds
        run: |
          echo "Investigate the surrounds"
          ls /

